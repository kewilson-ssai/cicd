# Reusable workflow: Python Build, Test, and Publish - Python 3.13
# Centralises build and test logic for Python packages.
#
# Usage (caller workflow):
#
#   jobs:
#     build:
#       uses: kewilson-ssai/cicd/.github/workflows/python_build3.13.yml@main
#       with:
#         python_version: '3.13'
#       secrets: inherit

name: python_build3.13 (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use for build and test (default: 3.13)'
        required: false
        type: string
        default: '3.13'
      python_container:
        description: 'Python container image to use (overrides python_version if set)'
        required: false
        type: string
        default: ''
      skip_test:
        description: 'Set to TRUE to skip the test job entirely'
        required: false
        type: string
        default: 'FALSE'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to use for build and test (default: 3.13)'
        required: false
        type: string
        default: '3.13'
jobs:
  test_python_module:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         !($SKIP_TEST == 'TRUE') || (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^patch-/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH || ${{ github.event.pull_request.base.ref }} =~ /^patch-/ )) || false
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      SKIP_TEST: ${{ inputs.skip_test || 'FALSE' }}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: echo " *** Building python module! *** "
    - run: poetry install
    - run: poetry run pip install pytest
    - run: poetry run pytest .
  build_python_module:
    needs: test_python_module
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^patch-/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^patch-/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: if [ "${DEBUG}" = "TRUE" ]; then env|grep CI;fi
    - run: if [[ "${{ github.ref }}" == "${CI_DEFAULT_BRANCH}" ]];then poetry version minor ;elif [[ "${{ github.ref }}" == patch* ]];then  poetry version patch; else poetry version prepatch ; fi
    - run: poetry env use ${PYTHON_VERSION}
    - run: echo " *** Building python module! *** "
    - run: poetry lock
    - run: poetry install
    - run: poetry build
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: dist/*
  publish_python_module:
    needs: build_python_module
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: github.event_name == 'workflow_dispatch'
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: pip install twine
    - run: echo " *** Publish build artifacts to GitLab Artifactory Registry *** "
    - run: TWINE_PASSWORD=${{ github.token }} TWINE_USERNAME=gitlab-ci-token python -m twine upload --verbose --repository-url ${{ github.api_url }}/projects/${{ github.repository }}/packages/pypi dist/*
