# Reusable workflow: release, tag, and publish GitHub release.
# Centralises release logic for repositories in the organization.
#
# Usage (caller workflow):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: kewilson-ssai/cicd/.github/workflows/release.yml@main
#       with:
#         version_override: ${{ inputs.version_override || '' }}
#       secrets: inherit

name: release (reusable)

on:
  workflow_call:
    inputs:
      version_override:
        description: 'Pin a specific VERSION; skips auto-versioning when set'
        required: false
        type: string
        default: ''
      python_container:
        description: 'Python container image used for the versioning and release job'
        required: false
        type: string
        default: 'python:3.13'
      python_version:
        description: 'Python version to use for release job (default: 3.13)'
        required: false
        type: string
        default: '3.13'
    outputs:
      version:
        description: 'The computed release version'
        value: ${{ jobs.release.outputs.version }}
      project_name:
        description: 'The project name from poetry'
        value: ${{ jobs.release.outputs.project_name }}
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override VERSION (skip auto-versioning)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      project_name: ${{ steps.set-version.outputs.project_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install poetry
        run: pip install poetry --no-cache-dir

      - name: Compute version
        id: set-version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
            if [ -f pyproject.toml ]; then
              poetry version "${VERSION}"
            fi
          else
            REF_NAME="${{ github.ref_name }}"
            CLEAN_BRANCH=$(echo "${REF_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            IS_PROTECTED="false"
            if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ] || [ "${REF_NAME}" = "main" ] || [ "${REF_NAME}" = "master" ] || echo "${REF_NAME}" | grep -qE '^patch-'; then
              IS_PROTECTED="true"
            fi

            if [ "${IS_PROTECTED}" = "true" ]; then
              if echo "${REF_NAME}" | grep -qE '^patch-'; then
                poetry version patch
              else
                poetry version minor
              fi
              VERSION=$(poetry version --short)
              TOP_LEVEL_PATTERN="^(${DEFAULT_BRANCH}|main|master|patch-.*)$"
              if ! echo "${REF_NAME}" | grep -qE "${TOP_LEVEL_PATTERN}"; then
                MAJOR=$(echo $VERSION | cut -d '.' -f1)
                MINOR=$(echo $VERSION | cut -d '.' -f2)
                PATCH=$(echo $VERSION | cut -d '.' -f3)
                VERSION="${MAJOR}.${MINOR}-${CLEAN_BRANCH}.${PATCH}"
              fi
            else
              poetry version prepatch
              VERSION=$(poetry version --short | sed 's/a/-a/')
              VERSION="${VERSION}-${CLEAN_BRANCH}"
            fi
          fi

          PROJECT_NAME=$(poetry version | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "project_name=${PROJECT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Computed VERSION=${VERSION} for PROJECT_NAME=${PROJECT_NAME}"

      - name: Commit version bump
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref_name, 'patch-')) }}
        run: |
          if [ -f pyproject.toml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            if ! git diff --staged --quiet; then
              git commit -m "chore: update version to ${{ steps.set-version.outputs.version }} [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Create Source Archive
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref_name, 'patch-')) }}
        id: package-archive
        run: |
          ARCHIVE_NAME="${PROJECT_NAME}-${VERSION}.tar.gz"
          tar --exclude='./.git' --exclude="./${ARCHIVE_NAME}" --exclude="${ARCHIVE_NAME}" -czf "/tmp/${ARCHIVE_NAME}" .
          mv "/tmp/${ARCHIVE_NAME}" .
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Tag and Release
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref_name, 'patch-')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.set-version.outputs.version }}
          name: v${{ steps.set-version.outputs.version }}
          body: v${{ steps.set-version.outputs.version }}
          files: ${{ steps.package-archive.outputs.archive_name }}
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
