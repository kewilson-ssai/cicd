name: Build cicd

on:
  push:
    branches:
      - main
      - master
      - 'patch-*'
  pull_request:
    branches:
      - main
      - master
      - 'patch-*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override VERSION (skip auto-versioning)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release_only.yml
    with:
      version_override: ${{ inputs.version_override || '' }}
    secrets: inherit
