name: ai_services (reusable)
on:
  workflow_call:
  workflow_dispatch:
jobs:
  docker-image-build:
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      project_name: ai-services
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: |
        echo "machine gitlab.com
        login gitlab-ci-token
        password ${{ github.token }}" >> ~/.netrc
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: cd container
    - run: echo ${CI_COMMIT_TAG+x}
    - run: docker buildx build --pull --progress=plain --secret id=netrc,src=$HOME/.netrc -t ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} -f Dockerfile .
    - run: CLEAN_BRANCH=$(echo "${CI_COMMIT_BRANCH:-${{ github.ref }}}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
    - run: if [[ "${CI_COMMIT_BRANCH:-${{ github.ref }}}" == "${CI_DEFAULT_BRANCH}" ]]; then LATEST_TAG="latest" else LATEST_TAG="${CLEAN_BRANCH}-latest" fi
    - run: if [[ "${CI_COMMIT_REF_PROTECTED}" == "true" ]]; then docker tag ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} ${CI_REGISTRY_IMAGE}/ai-services-image:${LATEST_TAG} docker tag ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} ai-services-image:${LATEST_TAG} docker push ${CI_REGISTRY_IMAGE}/ai-services-image:${LATEST_TAG} docker push ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} else docker tag ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} ${CI_REGISTRY_IMAGE}/ai-services-image:${LATEST_TAG} docker tag ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION} ai-services-image:${LATEST_TAG} docker push ${CI_REGISTRY_IMAGE}/ai-services-image:${LATEST_TAG} fi
  helm-package:
    runs-on: ubuntu-latest
    container:
      image: alpine/helm:latest
      options: "--entrypoint "
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      project_name: ai-services
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: cd chart
    - run: helm dependency update
    - run: helm package --version ${VERSION} --app-version ${VERSION} .
    - run: curl --request POST --user ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} --form "chart=@ai-services-${VERSION}.tgz" "${{ github.api_url }}/projects/${{ github.repository }}/packages/helm/api/stable/charts"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: chart/ai-services-*.tgz
  publish-ecr-common:
    needs:
    - docker-image-build
    - helm-package
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      project_name: ai-services
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: apk add --no-cache python3 py3-pip helm
    - run: python3 -m venv /path/to/venv
    - run: source ./venv/bin/activate
    - run: pip3 install --no-cache-dir awscli
    - run: helm repo add --username ${CI_REGISTRY_USER} --password ${CI_REGISTRY_PASSWORD} gitlab-ai-services https://gitlab.com/api/v4/projects/51937515/packages/helm/stable
    - run: helm repo update
    - run: export AWS_ACCOUNT_ID AWS_REGION AWS_SECRET_ACCESS_KEY AWS_ACCESS_KEY_ID
    - run: echo "check starting state of docker images"
    - run: echo "Pull images from gitlab image repo"
    - run: docker pull ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION}
    - run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - run: echo "*** Push images to AWS ECR ***"
    - run: docker tag  ${CI_REGISTRY_IMAGE}/ai-services-image:${VERSION}  $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ai-services-image:${VERSION}
    - run: docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ai-services-image:${VERSION}
    - run: echo "Pull helm charts from gitlab pacakge repo"
    - run: helm pull gitlab-ai-services/ai-services --version $VERSION
    - run: aws ecr get-login-password --region us-west-2 | helm registry login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - run: echo "Push charts to AWS ECR"
    - run: helm push ai-services-${VERSION}.tgz oci://${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  deploy_eks_ai-services:
    needs: publish-ecr-common
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      project_name: ai-services
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: |
        if [ ! -d ~/.aws ]; then mkdir ~/.aws; fi
        echo "[default]
        aws_access_key_id = $AWS_ACCESS_KEY_ID
        aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
        region = $AWS_REGION" > ~/.aws/credentials
        echo "$AWS_MASS_PROFILE" > ~/.aws/config
        apk add --no-cache python3 py3-pip helm curl
        curl -LO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
        chmod +x kubectl
        mv ./kubectl /usr/local/bin/kubectl
        python3 -m venv venv
        source ./venv/bin/activate
        pip3 install --no-cache-dir awscli
    - run: "cd ./chart\n\nAWS_PROFILE=maasstaging\nAWS_DEFAULT_REGION=us-west-2\nDEFAULT_NAMESPACE=growthsphere\nDEFAULT_VALUES_FILE=\"${AWS_PROFILE}\"-values.yaml\nDEFAULT_CHART=ai-services\nDEFAULT_RELEASE_NAME=\"${DEFAULT_CHART}\"\n\n: ${AWS_PROFILE:=${AWS_PROFILE}}\n: ${AWS_REGION:=${AWS_DEFAULT_REGION}}\n: ${NAMESPACE:=${DEFAULT_NAMESPACE}}\n: ${VALUES_FILE:=${DEFAULT_VALUES_FILE}}\n: ${CHART:=${DEFAULT_CHART}}\n: ${VERSION:=${VERSION}}\n: ${RELEASE_NAME:=${DEFAULT_RELEASE_NAME}}\n\nif [ -f ${VALUES_FILE} ]\nthen\n  OPTS=\"-f ${VALUES_FILE} \"\nelse \n  'echo \"ERROR: Could not find values file. ${VALUES_FILE}\"'\nexit 1\nfi\n\nREPO_ACCOUNT_ID=$(echo $(aws sts get-caller-identity --query Account)| tr -d '\"')\necho \"About to deploy helm charts ${VERSION}\"\n\naws --profile ${AWS_PROFILE} eks update-kubeconfig --region ${AWS_REGION} --name growthsphere-eks-cluster --alias ${AWS_PROFILE}\naws ecr get-login-password --region ${AWS_REGION} | helm registry login  --username AWS --password-stdin ${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\nhelm upgrade --kubeconfig ~/.kube/config --create-namespace -i -n ${NAMESPACE} ${OPTS} ${CHART}  oci://${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CHART} --version=$VERSION\n"
