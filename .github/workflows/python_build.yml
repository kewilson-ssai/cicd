# Reusable workflow: Python Build, Test, and Publish
# Centralises build and test logic for Python packages.
#
# Usage (caller workflow):
#
#   jobs:
#     build:
#       uses: kewilson-ssai/cicd/.github/workflows/python_build.yml@main
#       with:
#         python_version: '3.13' # optional, defaults to 3.13 (or repo variable vars.PYTHON_VERSION)
#       secrets: inherit

name: python_build (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use for build and test (default: 3.13)'
        required: false
        type: string
        default: '3.13'
      python_container:
        description: 'Python container image to use (overrides python_version if set)'
        required: false
        type: string
        default: ''
      skip_test:
        description: 'Set to TRUE to skip the test job entirely'
        required: false
        type: string
        default: 'FALSE'
      use_poetry:
        description: 'Use Poetry to install deps; set FALSE for pip'
        required: false
        type: string
        default: 'TRUE'
      requirements_file:
        description: 'Used when USE_POETRY=FALSE'
        required: false
        type: string
        default: 'requirements.txt'
      test_requirements_file:
        description: 'Extra test deps file when USE_POETRY=FALSE'
        required: false
        type: string
        default: ''
      coverage_source:
        description: 'Directory passed to --cov='
        required: false
        type: string
        default: '.'
      pytest_version:
        description: 'Pinned pytest version'
        required: false
        type: string
        default: '9.0.3'
      pytest_cov_version:
        description: 'Pinned pytest-cov version'
        required: false
        type: string
        default: '7.1.0'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to use for build and test (default: 3.13)'
        required: false
        type: string
        default: '3.13'
jobs:
  test_python_module:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         !($SKIP_TEST == 'TRUE') || (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^patch-/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH || ${{ github.event.pull_request.base.ref }} =~ /^patch-/ )) || false
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      GOOGLE_APPLICATION_CREDENTIALS: "$HOME/gcp_sa.json"
      GOOGLE_PROJECT: gsai-master
      TF_LOG: INFO
      SKIP_TEST: ${{ inputs.skip_test || 'FALSE' }}
      USE_POETRY: ${{ inputs.use_poetry || 'TRUE' }}
      REQUIREMENTS_FILE: ${{ inputs.requirements_file || 'requirements.txt' }}
      TEST_REQUIREMENTS_FILE: ${{ inputs.test_requirements_file || '' }}
      COVERAGE_SOURCE: ${{ inputs.coverage_source || '.' }}
      PYTEST_VERSION: ${{ inputs.pytest_version || '9.0.3' }}
      PYTEST_COV_VERSION: ${{ inputs.pytest_cov_version || '7.1.0' }}
      TEAMS_WEBHOOK_URL: https://default068aeee17ab641db8b6949fd4421d5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/34c094c552b446629cdad4759054e10c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3OpokvKh7eFsjk0WWU-TVAyxJGVe8QYRh1wEz2i4zSI
    steps:
    - uses: actions/checkout@v4.1.0
    - run:
        "!reference":
        - ".default_google_vertex"
        - before_script
    - run: |
        set -e
        if [ "$USE_POETRY" = "TRUE" ]; then
          pip install poetry --no-cache-dir
          poetry config http-basic.gitlab gitlab-ci-token "${{ github.token }}"
          poetry install
          poetry run pip install "pytest==${PYTEST_VERSION}" "pytest-cov==${PYTEST_COV_VERSION}"
          poetry run pytest . \
            --cov="${COVERAGE_SOURCE}" \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml || rc=$?
        else
          pip install -r "${REQUIREMENTS_FILE}" --no-cache-dir
          if [ -n "${TEST_REQUIREMENTS_FILE}" ]; then
            pip install -r "${TEST_REQUIREMENTS_FILE}" --no-cache-dir
          fi
          pip install "pytest==${PYTEST_VERSION}" "pytest-cov==${PYTEST_COV_VERSION}" --no-cache-dir
          pytest \
            --cov="${COVERAGE_SOURCE}" \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml || rc=$?
        fi
        rc=${rc:-0}
        [ "$rc" -eq 5 ] && { echo "*** No Unit tests ***"; exit 0; }
        [ "$rc" -eq 0 ] && { echo "*** Unit Tests Passed ***"; exit 0; }
        echo "*** Unit Tests Failed ***"; exit 1
    - uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        name: "${{ github.job }}"
        retention-days: 7
        path: |-
          coverage.xml
          test-results.xml
  build_python_module:
    needs: test_python_module
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^patch-/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^patch-/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      GOOGLE_APPLICATION_CREDENTIALS: "$HOME/gcp_sa.json"
      GOOGLE_PROJECT: gsai-master
      TF_LOG: INFO
      SKIP_TEST: ${{ inputs.skip_test || 'FALSE' }}
      USE_POETRY: ${{ inputs.use_poetry || 'TRUE' }}
      REQUIREMENTS_FILE: ${{ inputs.requirements_file || 'requirements.txt' }}
      TEST_REQUIREMENTS_FILE: ${{ inputs.test_requirements_file || '' }}
      COVERAGE_SOURCE: ${{ inputs.coverage_source || '.' }}
      PYTEST_VERSION: ${{ inputs.pytest_version || '9.0.3' }}
      PYTEST_COV_VERSION: ${{ inputs.pytest_cov_version || '7.1.0' }}
      TEAMS_WEBHOOK_URL: https://default068aeee17ab641db8b6949fd4421d5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/34c094c552b446629cdad4759054e10c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3OpokvKh7eFsjk0WWU-TVAyxJGVe8QYRh1wEz2i4zSI
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: if [[ "${{ github.ref }}" == "${CI_DEFAULT_BRANCH}" ]];then poetry version minor ;elif [[ "${{ github.ref }}" == patch* ]];then  poetry version patch; else poetry version prepatch ; fi
    - run: poetry env use ${PYTHON_VERSION}
    - run: echo " *** Building python module! *** "
    - run: poetry install
    - run: poetry build
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: dist/*
  publish_python_module:
    needs: build_python_module
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    if: github.event_name == 'workflow_dispatch'
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      GOOGLE_APPLICATION_CREDENTIALS: "$HOME/gcp_sa.json"
      GOOGLE_PROJECT: gsai-master
      TF_LOG: INFO
      SKIP_TEST: ${{ inputs.skip_test || 'FALSE' }}
      USE_POETRY: ${{ inputs.use_poetry || 'TRUE' }}
      REQUIREMENTS_FILE: ${{ inputs.requirements_file || 'requirements.txt' }}
      TEST_REQUIREMENTS_FILE: ${{ inputs.test_requirements_file || '' }}
      COVERAGE_SOURCE: ${{ inputs.coverage_source || '.' }}
      PYTEST_VERSION: ${{ inputs.pytest_version || '9.0.3' }}
      PYTEST_COV_VERSION: ${{ inputs.pytest_cov_version || '7.1.0' }}
      TEAMS_WEBHOOK_URL: https://default068aeee17ab641db8b6949fd4421d5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/34c094c552b446629cdad4759054e10c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3OpokvKh7eFsjk0WWU-TVAyxJGVe8QYRh1wEz2i4zSI
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
    - run: pip install twine
    - run: echo " *** Publish build artifacts to GitLab Artifactory Registry *** "
    - run: TWINE_PASSWORD=${{ github.token }} TWINE_USERNAME=gitlab-ci-token python -m twine upload --verbose --repository-url ${{ github.api_url }}/projects/${{ github.repository }}/packages/pypi dist/*
  notify_pipeline_failure:
    needs: publish_python_module
    runs-on: ubuntu-latest
    container:
      image: curlimages/curl:latest
    if: # Unable to map conditional expression to GitHub Actions equivalent
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      GOOGLE_APPLICATION_CREDENTIALS: "$HOME/gcp_sa.json"
      GOOGLE_PROJECT: gsai-master
      TF_LOG: INFO
      SKIP_TEST: ${{ inputs.skip_test || 'FALSE' }}
      USE_POETRY: ${{ inputs.use_poetry || 'TRUE' }}
      REQUIREMENTS_FILE: ${{ inputs.requirements_file || 'requirements.txt' }}
      TEST_REQUIREMENTS_FILE: ${{ inputs.test_requirements_file || '' }}
      COVERAGE_SOURCE: ${{ inputs.coverage_source || '.' }}
      PYTEST_VERSION: ${{ inputs.pytest_version || '9.0.3' }}
      PYTEST_COV_VERSION: ${{ inputs.pytest_cov_version || '7.1.0' }}
      TEAMS_WEBHOOK_URL: https://default068aeee17ab641db8b6949fd4421d5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/34c094c552b446629cdad4759054e10c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=3OpokvKh7eFsjk0WWU-TVAyxJGVe8QYRh1wEz2i4zSI
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
    - run: |
        cat > card.json <<EOF
        {
          "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
          "type": "AdaptiveCard",
          "version": "1.5",
          "body": [
            {
              "type": "TextBlock",
              "text": "CI/CD Job Failed",
              "weight": "Bolder",
              "size": "Medium",
              "color": "Attention"
            },
            {
              "type": "FactSet",
              "facts": [
                { "title": "Repository", "value": "${{ github.repository }}" },
                { "title": "Job", "value": "Pipeline #${{ github.repository}}/${{ github.workflow }} on ${{ github.ref }}" }
              ]
            }
          ],
          "actions": [
            {
              "type": "Action.OpenUrl",
              "title": "View Job Logs",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          ]
        }
        EOF
    - run: 'curl -sS --fail-with-body -X POST "${TEAMS_WEBHOOK_URL}" -H "Content-Type: application/json" -d @card.json'
