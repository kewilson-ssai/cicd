name: UI (reusable)
on:
  workflow_call:
  workflow_dispatch:
jobs:
  unit_test_backend:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         !(${{ github.ref }}) || (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && (${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
      SKIP_TEST: ${SKIP_TEST:-"FALSE"}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: echo " *** Building python module! *** "
    - run: poetry lock
    - run: poetry install
    - run: poetry add pytest
    - run: poetry run pytest ./backend
  unit_test_frontend:
    runs-on: ubuntu-latest
    container:
      image: node:20.15.1
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         !(${{ github.ref }}) || (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && (${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
      SKIP_TEST: ${SKIP_TEST:-"FALSE"}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: npm config set @scope:registry https://gitlab.com/api/v4/packages/npm/
    - run: npm add jest -g
    - run: echo "Install dependencies and running unit test"
    - run: cd ./frontend
    - run: npm ci
    - run: npm run test
#     # 'artifacts.junit' was not transformed because there is no suitable equivalent in GitHub Actions
  docker_build_backend:
    needs:
    - unit_test_backend
    - unit_test_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: |
        echo "machine gitlab.com login gitlab-ci-token password ${{ github.token }}" > ~/.netrc
        docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: |
        echo " *** Build backend docker image *** "
        cd backend
        echo ${CI_COMMIT_TAG+x}
        docker buildx build --no-cache --progress=plain --secret id=backend_netrc,src=$HOME/.netrc -t ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION} .
        CLEAN_BRANCH=$(echo "${CI_COMMIT_BRANCH:-${{ github.ref }}}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
        if [[ "${CI_COMMIT_BRANCH:-${{ github.ref }}}" == "${CI_DEFAULT_BRANCH}" ]]; then
          LATEST_TAG="latest"
        else
          LATEST_TAG="${CLEAN_BRANCH}-latest"
        fi
        if [[ "${CI_COMMIT_REF_PROTECTED}" == "true" ]]; then
          docker tag ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION} ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${LATEST_TAG}
          docker tag ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION} ${BACKEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION}
        else
          docker tag ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION} ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${LATEST_TAG}
          docker tag ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION} ${BACKEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${LATEST_TAG}
        fi
  docker_build_frontend:
    needs:
    - unit_test_backend
    - unit_test_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: |
        echo " *** Build frontend docker image *** "
        cd frontend
        echo ${CI_COMMIT_TAG+x}
        docker buildx build --no-cache --progress=plain --build-arg ENV=prod -t ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION} .
        CLEAN_BRANCH=$(echo "${CI_COMMIT_BRANCH:-${{ github.ref }}}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
        if [[ "${CI_COMMIT_BRANCH:-${{ github.ref }}}" == "${CI_DEFAULT_BRANCH}" || "${CI_COMMIT_BRANCH:-${{ github.ref }}}" == "master" ]]; then
          LATEST_TAG="latest"
        else
          LATEST_TAG="${CLEAN_BRANCH}-latest"
        fi
        if [[ "${CI_COMMIT_REF_PROTECTED}" == "true" ]]; then
          docker tag ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION} ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${LATEST_TAG}
          docker tag ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION} ${FRONTEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION}
        else
          docker tag ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION} ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${LATEST_TAG}
          docker tag ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION} ${FRONTEND}-image:${LATEST_TAG}
          docker push ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${LATEST_TAG}
        fi
  helm_package_backend:
    needs:
    - unit_test_backend
    - unit_test_frontend
    runs-on: ubuntu-latest
    container:
      image: alpine/helm:latest
      options: "--entrypoint "
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: cd backend/chart
    - run: helm dependency update
    - run: helm package --version ${VERSION} --app-version ${VERSION} .
    - run: curl --request POST --user ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} --form "chart=@${BACKEND}-${VERSION}.tgz" "${{ github.api_url }}/projects/${{ github.repository }}/packages/helm/api/stable/charts"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: backend/chart/${BACKEND}-*.tgz
  helm_package_frontend:
    needs:
    - unit_test_backend
    - unit_test_frontend
    runs-on: ubuntu-latest
    container:
      image: alpine/helm:latest
      options: "--entrypoint "
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         (always() && ${{ github.ref }} == $CI_DEFAULT_BRANCH) || (always() && ${{ github.ref }} =~ /^staging/) || (always() && ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} =~ /^staging/ || ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH)) || false
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: cd frontend/chart
    - run: helm dependency update
    - run: helm package --version ${VERSION} --app-version ${VERSION} .
    - run: curl --request POST --user ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} --form "chart=@${FRONTEND}-${VERSION}.tgz" "${{ github.api_url }}/projects/${{ github.repository }}/packages/helm/api/stable/charts"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: frontend/chart/${FRONTEND}-*.tgz
  publish_ecr_backend:
    needs:
    - docker_build_backend
    - docker_build_frontend
    - helm_package_backend
    - helm_package_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: apk add --no-cache python3 py3-pip helm
    - run: python3 -m venv venv
    - run: source ./venv/bin/activate
    - run: pip3 install --no-cache-dir awscli
    - run: helm repo add --username ${CI_REGISTRY_USER} --password ${CI_REGISTRY_PASSWORD} gitlab ${{ github.api_url }}/projects/${{ github.repository }}/packages/helm/stable
    - run: helm repo update
    - run: export AWS_ACCOUNT_ID AWS_REGION AWS_SECRET_ACCESS_KEY AWS_ACCESS_KEY_ID
    - run: echo "Pull images from gitlab image repo"
    - run: docker pull ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION}
    - run: aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - run: echo "*** Push backend UI images to AWS ECR ***"
    - run: docker tag  ${CI_REGISTRY_IMAGE}/${BACKEND}-image:${VERSION}  $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${BACKEND}-image:${VERSION}
    - run: docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND}-image:${VERSION}
    - run: echo "Pull helm charts from gitlab pacakge repo"
    - run: helm pull gitlab/${BACKEND} --version $VERSION
    - run: aws ecr get-login-password --region us-west-2 | helm registry login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - run: helm push ${BACKEND}-${VERSION}.tgz oci://${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  publish_ecr_frontend:
    needs:
    - docker_build_backend
    - docker_build_frontend
    - helm_package_backend
    - helm_package_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - run: apk add --no-cache python3 py3-pip helm
    - run: python3 -m venv venv
    - run: source ./venv/bin/activate
    - run: pip3 install --no-cache-dir awscli
    - run: helm repo add --username ${CI_REGISTRY_USER} --password ${CI_REGISTRY_PASSWORD} gitlab ${{ github.api_url }}/projects/${{ github.repository }}/packages/helm/stable
    - run: helm repo update
    - run: export AWS_ACCOUNT_ID AWS_REGION AWS_SECRET_ACCESS_KEY AWS_ACCESS_KEY_ID
    - run: echo "Pull images from gitlab image repo"
    - run: docker pull ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION}
    - run: aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - run: echo "*** Push frontend UI images to AWS ECR ***"
    - run: docker tag  ${CI_REGISTRY_IMAGE}/${FRONTEND}-image:${VERSION}  $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${FRONTEND}-image:${VERSION}
    - run: docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND}-image:${VERSION}
    - run: echo "Pull helm charts from gitlab pacakge repo"
    - run: helm pull gitlab/${FRONTEND} --version $VERSION
    - run: aws ecr get-login-password --region us-west-2 | helm registry login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
    - run: helm push ${FRONTEND}-${VERSION}.tgz oci://${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  deploy_eks_backend:
    needs:
    - publish_ecr_backend
    - publish_ecr_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: |
        if [ ! -d ~/.aws ]; then mkdir ~/.aws; fi
        echo "[default]
        aws_access_key_id = $AWS_ACCESS_KEY_ID
        aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
        region = $AWS_REGION" > ~/.aws/credentials
        echo "$AWS_MASS_PROFILE" > ~/.aws/config
        apk add --no-cache python3 py3-pip helm curl
        curl -LO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
        chmod +x kubectl
        mv ./kubectl /usr/local/bin/kubectl
        python3 -m venv venv
        source ./venv/bin/activate
        pip3 install --no-cache-dir awscli
    - run: "cd backend/chart\n\nAWS_PROFILE=maasstaging\nAWS_DEFAULT_REGION=us-west-2\nDEFAULT_NAMESPACE=growthsphere\nDEFAULT_VALUES_FILE=\"${AWS_PROFILE}\"-values.yaml\nDEFAULT_CHART=${PROJECT}-backend\nDEFAULT_RELEASE_NAME=\"${DEFAULT_CHART}\"\n\n: ${AWS_PROFILE:=${AWS_PROFILE}}\n: ${AWS_REGION:=${AWS_DEFAULT_REGION}}\n: ${NAMESPACE:=${DEFAULT_NAMESPACE}}\n: ${VALUES_FILE:=${DEFAULT_VALUES_FILE}}\n: ${CHART:=${DEFAULT_CHART}}\n: ${VERSION:=${VERSION}}\n: ${RELEASE_NAME:=${DEFAULT_RELEASE_NAME}}\n\nif [ -f ${VALUES_FILE} ]\nthen\n  OPTS=\"-f ${VALUES_FILE} \"\nelse \n  'echo \"ERROR: Could not find values file. ${VALUES_FILE}\"'\nexit 1\nfi\n\nREPO_ACCOUNT_ID=$(echo $(aws sts get-caller-identity --query Account)| tr -d '\"')\necho \"About to deploy helm charts ${VERSION}\"\n\naws --profile ${AWS_PROFILE} eks update-kubeconfig --region ${AWS_REGION} --name growthsphere-eks-cluster --alias ${AWS_PROFILE}\naws ecr get-login-password --region ${AWS_REGION} | helm registry login  --username AWS --password-stdin ${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\nhelm upgrade --kubeconfig ~/.kube/config --create-namespace -i -n ${NAMESPACE} ${OPTS} ${CHART}  oci://${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CHART} --version=$VERSION\n"
  deploy_eks_frontend:
    needs:
    - publish_ecr_backend
    - publish_ecr_frontend
    runs-on: ubuntu-latest
    container:
      image: docker:latest
    if: github.event_name == 'workflow_dispatch'
    services:
      docker:dind:
        image: docker:dind
    env:
      FRONTEND: "${PROJECT}-frontend"
      BACKEND: "${PROJECT}-backend"
    steps:
    - uses: actions/checkout@v4.1.0
    - uses: actions/download-artifact@v4.1.0
      with:
        name: noop_version_passthrough
    - uses: actions/download-artifact@v4.1.0
      with:
        name: prerelease_tag
    - run: |
        if [ ! -d ~/.aws ]; then mkdir ~/.aws; fi
        echo "[default]
        aws_access_key_id = $AWS_ACCESS_KEY_ID
        aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
        region = $AWS_REGION" > ~/.aws/credentials
        echo "$AWS_MASS_PROFILE" > ~/.aws/config
        apk add --no-cache python3 py3-pip helm curl
        curl -LO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
        chmod +x kubectl
        mv ./kubectl /usr/local/bin/kubectl
        python3 -m venv venv
        source ./venv/bin/activate
        pip3 install --no-cache-dir awscli
    - run: "cd frontend/chart\n\nAWS_PROFILE=maasstaging\nAWS_DEFAULT_REGION=us-west-2\nDEFAULT_NAMESPACE=growthsphere\nDEFAULT_VALUES_FILE=\"${AWS_PROFILE}\"-values.yaml\nDEFAULT_CHART=${PROJECT}-frontend\nDEFAULT_RELEASE_NAME=\"${DEFAULT_CHART}\"\n\n: ${AWS_PROFILE:=${AWS_PROFILE}}\n: ${AWS_REGION:=${AWS_DEFAULT_REGION}}\n: ${NAMESPACE:=${DEFAULT_NAMESPACE}}\n: ${VALUES_FILE:=${DEFAULT_VALUES_FILE}}\n: ${CHART:=${DEFAULT_CHART}}\n: ${VERSION:=${VERSION}}\n: ${RELEASE_NAME:=${DEFAULT_RELEASE_NAME}}\n\nif [ -f ${VALUES_FILE} ]\nthen\n  OPTS=\"-f ${VALUES_FILE} \"\nelse \n  'echo \"ERROR: Could not find values file. ${VALUES_FILE}\"'\nexit 1\nfi\n\nREPO_ACCOUNT_ID=$(echo $(aws sts get-caller-identity --query Account)| tr -d '\"')\necho \"About to deploy helm charts ${VERSION}\"\n\naws --profile ${AWS_PROFILE} eks update-kubeconfig --region ${AWS_REGION} --name growthsphere-eks-cluster --alias ${AWS_PROFILE}\naws ecr get-login-password --region ${AWS_REGION} | helm registry login  --username AWS --password-stdin ${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\nhelm upgrade --kubeconfig ~/.kube/config --create-namespace -i -n ${NAMESPACE} ${OPTS} ${CHART}  oci://${REPO_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CHART} --version=$VERSION"
