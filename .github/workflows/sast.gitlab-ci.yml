name: isnp/gsai/cicd
on:
  push:
  workflow_dispatch:
jobs:
  sast:
    runs-on: ubuntu-latest
    if: false
    env:
      SECURE_ANALYZERS_PREFIX: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
      SAST_IMAGE_SUFFIX: ''
      SAST_EXCLUDED_ANALYZERS: ''
      DEFAULT_SAST_EXCLUDED_PATHS: spec, test, tests, tmp
      SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS"
      GITLAB_ADVANCED_SAST_ENABLED: 'true'
      SEARCH_MAX_DEPTH: 4
    steps:
    - uses: actions/checkout@v4.1.0
    - run: echo "${{ github.job }} is used for configuration only, and its script should not be executed"
    - run: exit 1
#     # 'artifacts.sast' was not transformed because there is no suitable equivalent in GitHub Actions
  sast_scan:
    runs-on: ubuntu-latest
    container:
      image: "$SAST_ANALYZER_IMAGE"
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         !($SAST_DISABLED == 'true' || $SAST_DISABLED == '1') || !($SAST_EXCLUDED_ANALYZERS =~ /semgrep/) || ${{ github.ref }} && $GITLAB_FEATURES =~ /\bsast_advanced\b/ && $SAST_EXCLUDED_ANALYZERS !~ /gitlab-advanced-sast/ && ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1') || ${{ github.ref }} || ${{ github.event_name }} == 'merge_request_event' && ( ${{ github.event.pull_request.base.ref }} == $CI_DEFAULT_BRANCH ||  ${{ github.event.pull_request.base.ref }} =~ /^patch-/ ) && ( ${{ github.ref }} == $CI_DEFAULT_BRANCH || ${{ github.ref }} =~ /^patch-/ ) || !(${{ github.ref }} && $GITLAB_FEATURES =~ /\bsast_advanced\b/ && $SAST_EXCLUDED_ANALYZERS !~ /gitlab-advanced-sast/ && ($GITLAB_ADVANCED_SAST_ENABLED == 'true' || $GITLAB_ADVANCED_SAST_ENABLED == '1')) || ${{ github.ref }}
    continue-on-error: true
    env:
      SECURE_ANALYZERS_PREFIX: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
      SAST_IMAGE_SUFFIX: ''
      SAST_EXCLUDED_ANALYZERS: ''
      DEFAULT_SAST_EXCLUDED_PATHS: spec, test, tests, tmp
      SAST_EXCLUDED_PATHS: "$DEFAULT_SAST_EXCLUDED_PATHS"
      GITLAB_ADVANCED_SAST_ENABLED: 'true'
      SEARCH_MAX_DEPTH: 20
      SAST_ANALYZER_IMAGE_TAG: 5
      SAST_ANALYZER_IMAGE: "$SECURE_ANALYZERS_PREFIX/semgrep:$SAST_ANALYZER_IMAGE_TAG$SAST_IMAGE_SUFFIX"
    steps:
    - uses: actions/checkout@v4.1.0
    - run: "/analyzer run"
#     # 'artifacts.sast' was not transformed because there is no suitable equivalent in GitHub Actions
