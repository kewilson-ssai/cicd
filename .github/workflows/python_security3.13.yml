# Reusable workflow: Python Security Scanning (Bandit) - Python 3.13
# Centralises security analysis for Python packages.
#
# Usage (caller workflow):
#
#   jobs:
#     security:
#       uses: kewilson-ssai/cicd/.github/workflows/python_security3.13.yml@main
#       with:
#         python_version: '3.13'
#       secrets: inherit

name: python_security3.13 (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use for security scan (default: 3.13)'
        required: false
        type: string
        default: '3.13'
      python_container:
        description: 'Python container image to use (overrides python_version if set)'
        required: false
        type: string
        default: ''
      bandit_enforced_level:
        description: 'Bandit severity level'
        required: false
        type: string
        default: 'low'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to use for security scan (default: 3.13)'
        required: false
        type: string
        default: '3.13'
jobs:
  bandit_scan_reports:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: python --version
    - run: poetry env use ${PYTHON_VERSION}
    - run: poetry run pip install bandit
    - run: poetry run bandit -c pyproject.toml -r . --format html --exit-zero --output bandit_scan_report.html
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        path: "./bandit_scan_report.html"
  bandit_scan:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.python_container || vars.PYTHON_CONTAINER || (inputs.python_version && format('python:{0}', inputs.python_version)) || (vars.PYTHON_VERSION && format('python:{0}', vars.PYTHON_VERSION)) || 'python:3.13' }}
    env:
      PYTHON_VERSION: ${{ inputs.python_version || vars.PYTHON_VERSION || '3.13' }}
      BANDIT_ENFORCED_LEVEL: ${{ inputs.bandit_enforced_level || 'low' }}
    steps:
    - uses: actions/checkout@v4.1.0
    - run: echo "GSAI_CICD_VERSION ${GSAI_CICD_VERSION}"
    - run: echo "Scan Level ${BANDIT_ENFORCED_LEVEL} "
    - run: pip install poetry --no-cache-dir
    - run: poetry config http-basic.gitlab gitlab-ci-token ${{ github.token }}
    - run: ls -la
    - run: python --version
    - run: poetry env use ${PYTHON_VERSION}
    - run: poetry run pip install bandit
    - run: poetry run bandit -c pyproject.toml -r . --severity-level ${BANDIT_ENFORCED_LEVEL}
